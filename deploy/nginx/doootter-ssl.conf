# HTTPS (port 443) origin for Dootter, for Cloudflare -> origin.
#
# Installed by scripts/deploy-vps.sh only after certbot has issued the
# certificate. Keep the TLS settings strict: Cloudflare connects to the origin
# as a normal client and Cloudflare's own cipher list is negotiated separately,
# so there is no reason to loosen anything here.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name converter-doootter.ru www.converter-doootter.ru;

    ssl_certificate     /etc/letsencrypt/live/converter-doootter.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/converter-doootter.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/doootter;
    index index.html;

    types {
        text/html                             html htm;
        text/css                              css;
        text/javascript                       js mjs;
        application/javascript                mjs;
        application/json                      json webmanifest;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/x-icon                          ico;
        font/ttf                              ttf;
        font/woff                             woff;
        font/woff2                            woff2;
        text/plain                            txt;
        application/xml                       xml;
    }
    default_type application/octet-stream;

    access_log /var/log/nginx/doootter.access.log;
    error_log  /var/log/nginx/doootter.error.log warn;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    location = /pdf.worker.min.mjs {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    location ^~ /.well-known/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}