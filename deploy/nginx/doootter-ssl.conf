# HTTPS (port 443) origin for Dootter.
#
# Installed by scripts/deploy-vps.sh only after certbot has issued the
# certificate. DNS is served by reg.ru and points straight at this host, so
# there is no CDN in front of the origin and TLS is negotiated with browsers
# directly. Keep the settings strict.

server {
    # HTTP/2 is enabled on the listen directive rather than with a standalone
    # `http2 on;` block: that directive only exists from nginx 1.25.1 onwards and
    # this host runs the 1.24.0 that Ubuntu 24.04 ships.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name converter-dotter.ru www.converter-dotter.ru;

    ssl_certificate     /etc/letsencrypt/live/converter-dotter.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/converter-dotter.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/doootter;
    index index.html;

    # Keep www as a real TLS endpoint so the redirect below never bounces a
    # visitor from https to http. Canonical lives on the apex. The map that
    # drives this lives in doootter.conf, which is always installed alongside.
    if ($doootter_canonical_redirect = 1) {
        return 301 https://converter-dotter.ru$request_uri;
    }

    types {
        text/html                             html htm;
        text/css                              css;
        text/javascript                       js;
        application/javascript                mjs;
        application/json                      json webmanifest;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/x-icon                          ico;
        font/ttf                              ttf;
        font/woff                             woff;
        font/woff2                            woff2;
        text/plain                            txt;
        application/xml                       xml;
    }
    default_type application/octet-stream;

    access_log /var/log/nginx/doootter.access.log;
    error_log  /var/log/nginx/doootter.error.log warn;

    # Visitor and conversion counter, proxied to the local Python service.
    # Same ^~ prefix as in doootter.conf so it takes precedence over `location /`.
    location ^~ /api/stats {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: the counter identifies a
        # visitor by this header, so a client-supplied X-Forwarded-For would let
        # anyone invent a new identity per request and defeat both the daily
        # de-duplication and the rate limit. The origin is not proxied, so the
        # connecting address is always the real client.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header Origin            $http_origin;
        proxy_set_header Sec-Fetch-Site    $http_sec_fetch_site;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    location = /pdf.worker.min.mjs {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    location ^~ /.well-known/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}