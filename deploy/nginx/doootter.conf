# HTTP (port 80) origin for Dootter.
#
# DNS is served by reg.ru and points straight at this host, so this block talks
# to browsers directly. It must also stay functional over plain HTTP because
# Let's Encrypt validates the domain with the ACME HTTP-01 challenge before any
# certificate exists.

# Decides what to do with an incoming request:
#   0 -> serve it as-is (ACME challenge, never redirect or renewals break)
#   1 -> bounce to the canonical apex
#   2 -> upgrade http to https on the same host
# The ACME path is deliberately excluded everywhere: certbot has to fetch the
# token over plain HTTP, and following a redirect to https would fail while the
# certificate is still being issued for the very first time.
# Regex entries are evaluated in order, so the first match wins.
map $host$request_uri $doootter_canonical_redirect {
    default                                                   0;
    "~^www\.converter-dotter\.ru/\.well-known/acme-challenge/" 0;
    "~^www\.converter-dotter\.ru"                            1;
    "~^.*/\.well-known/acme-challenge/"                      0;
    "~^"                                                     2;
}

server {
    listen 80;
    listen [::]:80;
    server_name converter-dotter.ru www.converter-dotter.ru;

    root /var/www/doootter;
    index index.html;

    # nginx's default mime.types has no .mjs entry. Without this the pdf.js
    # worker is served as octet-stream and the browser refuses to execute it.
    types {
        text/html                             html htm;
        text/css                              css;
        text/javascript                       js;
        application/javascript                mjs;
        application/json                      json webmanifest;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/x-icon                          ico;
        font/ttf                              ttf;
        font/woff                             woff;
        font/woff2                            woff2;
        text/plain                            txt;
        application/xml                       xml;
    }
    default_type application/octet-stream;

    access_log /var/log/nginx/doootter.access.log;
    error_log  /var/log/nginx/doootter.error.log warn;

    # www is delegated in DNS to this same host, so canonical URLs point at the
    # apex and www has to be redirected here rather than at the edge. Once a
    # certificate exists, plain HTTP is upgraded to HTTPS so visitors are never
    # left on an unencrypted connection.
    if ($doootter_canonical_redirect = 1) {
        return 301 https://converter-dotter.ru$request_uri;
    }
    if ($doootter_canonical_redirect = 2) {
        return 301 https://$host$request_uri;
    }

    # Certbot writes its challenges here. Must stay above the site root and
    # must not be caught by the caching rules below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Visitor and conversion counter. Proxied to the local Python service on
    # 8099, which is the only writable component in the stack. ^~ makes this
    # win over the plain `location /` prefix match below, so /api/stats never
    # falls through to try_files and 404s as a missing static file.
    location ^~ /api/stats {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: the counter identifies a
        # visitor by this header, so a client-supplied X-Forwarded-For would let
        # anyone invent a new identity per request and defeat both the daily
        # de-duplication and the rate limit. The origin is not proxied, so the
        # connecting address is always the real client.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header Origin            $http_origin;
        proxy_set_header Sec-Fetch-Site    $http_sec_fetch_site;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        # Totals change constantly, so nothing here may be cached.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        # The service already sends "no-store, max-age=0", and nginx's add_header
        # appends rather than replaces, so adding it again here would ship the
        # directive twice in one header.
    }

    # HTML. Every document is revalidated on each visit: documents are rewritten
    # on every deploy, so a cached copy would serve stale markup and stale
    # canonical tags to search engines.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    # Fingerprinted JS and CSS. immutable is safe because Next.js renames every
    # changed file under _next/static.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    # Roboto faces, used by the Word renderer for body text.
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    # pdf.js worker. Cross-origin on purpose: the library resolves the worker
    # against its own origin rather than against the page's.
    location = /pdf.worker.min.mjs {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    # security.txt is served from the site root via the default location, but an
    # explicit rule keeps its cache behaviour predictable.
    location ^~ /.well-known/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}