# HTTP (port 80) origin for Dootter, for Cloudflare -> origin.
#
# Cloudflare terminates TLS for visitors. This block also has to work over plain
# HTTP because Let's Encrypt validates the domain through the ACME HTTP-01
# challenge, which Cloudflare proxies to the origin on port 80.

server {
    listen 80;
    listen [::]:80;
    server_name converter-doootter.ru www.converter-doootter.ru;

    root /var/www/doootter;
    index index.html;

    # nginx's default mime.types has no .mjs entry. Without this the pdf.js
    # worker is served as octet-stream and the browser refuses to execute it.
    types {
        text/html                             html htm;
        text/css                              css;
        text/javascript                       js mjs;
        application/javascript                mjs;
        application/json                      json webmanifest;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/x-icon                          ico;
        font/ttf                              ttf;
        font/woff                             woff;
        font/woff2                            woff2;
        text/plain                            txt;
        application/xml                       xml;
    }
    default_type application/octet-stream;

    access_log /var/log/nginx/doootter.access.log;
    error_log  /var/log/nginx/doootter.error.log warn;

    # Certbot writes its challenges here. Must stay above the site root and
    # must not be caught by the caching rules below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # HTML. Every document is revalidated on each visit: documents are rewritten
    # on every deploy, so a cached copy would serve stale markup and stale
    # canonical tags to search engines.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    # Fingerprinted JS and CSS. immutable is safe because Next.js renames every
    # changed file under _next/static.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    # Roboto faces, used by the Word renderer for body text.
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    # pdf.js worker. Cross-origin on purpose: the library resolves the worker
    # against its own origin rather than against the page's.
    location = /pdf.worker.min.mjs {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    # security.txt is served from the site root via the default location, but an
    # explicit rule keeps its cache behaviour predictable.
    location ^~ /.well-known/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/doootter-security-headers.conf;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}