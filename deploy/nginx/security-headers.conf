# Security headers, mirrored from public/_headers.
#
# One deliberate difference: upgrade-insecure-requests is NOT set here, unlike in
# public/_headers. That directive makes the browser rewrite every subresource
# request to https://, so on an origin that still serves plain HTTP it turns
# every stylesheet and script into a failed request and the page renders
# unstyled. Behind Cloudflare the visitor always arrives over HTTPS, so the
# directive is a no-op there and public/_headers keeps it for Cloudflare Pages.
#
# nginx add_header does not merge across contexts: as soon as a location block
# declares its own add_header, every header inherited from the server block is
# dropped. That is why these live in a separate file and are `include`d in both
# the server context and in each location that overrides Cache-Control.
#
# The CSP lists the Yandex.RTB advertising network: its origin is needed in
# script-src for the loader, img-src for creatives, connect-src for the ad
# request, and frame-src because most ad formats render inside an iframe. The
# converter is unaffected by this: files are still read in the browser.
#
# This snippet deliberately contains no Cache-Control: caching differs per
# location and is set next to each include.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-DNS-Prefetch-Control "off" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://yandex.ru https://*.yandex.ru https://yastatic.net https://*.yastatic.net; style-src 'self' 'unsafe-inline' https://yastatic.net https://*.yastatic.net; img-src 'self' data: blob: https://*.yandex.ru https://yastatic.net https://*.yastatic.net https://mc.yandex.com https://*.mc.yandex.com; font-src 'self' https://yastatic.net https://*.yastatic.net; connect-src 'self' blob: https://yandex.ru https://*.yandex.ru https://yastatic.net https://*.yastatic.net https://mc.yandex.com https://*.mc.yandex.com wss://mc.yandex.com wss://*.mc.yandex.com; worker-src 'self' blob:; child-src 'self' blob:; frame-src https://yandex.ru https://*.yandex.ru https://yastatic.net https://*.yastatic.net; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'" always;